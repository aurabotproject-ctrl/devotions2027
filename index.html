<body data-term="t1">
  <div class="ink-bg"></div>
  <canvas id="menu-canvas"></canvas>
  <main id="menu-view"></main>

  <div id="stage-wrap" hidden>
    <div id="stage" data-mood="dawn">
      <div class="mood-bg"></div>
      <div class="halftone"></div>
      <div class="slide-layer"></div>
      <canvas id="particles"></canvas>
      <div class="chrome">
        <div class="nav-zone l" title="Back"></div>
        <div class="controls">
          <button class="cbtn" data-a="prev" title="Back (←)">◀</button>
          <button class="cbtn" data-a="next" title="Next (→ / Space)">▶</button>
          <button class="cbtn" data-a="grid" title="Slide grid (G)">⊞</button>
          <button class="cbtn" data-a="notes" title="Teacher notes (N)">📝</button>
          <button class="cbtn" data-a="full" title="Fullscreen (F)">⛶</button>
          <button class="cbtn" data-a="help" title="Controls (?)">?</button>
          <button class="cbtn wide" data-a="exit" title="Exit (Esc)">✕ Exit</button>
        </div>
        <div class="pacing"><span>⏱</span><span class="pt">0:00</span><span class="pbar"><i></i></span></div>
        <div class="step-dots"></div>
        <div class="slide-count"></div>
        <div class="progress"><i></i></div>
      </div>
      <aside class="drawer"></aside>
    </div>
  </div>
